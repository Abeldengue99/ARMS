<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário - ARMS</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="img/favicon.svg">
    <meta name="theme-color" content="#111111">
    <script>
        (function () {
            try {
                var dados = JSON.parse(localStorage.getItem('arms_utilizador_dados') || 'null');
                if (!dados) {
                    document.documentElement.classList.add('role-pending');
                    return;
                }
                if (!dados || dados.admin !== true) {
                    document.documentElement.classList.add('is-client-role');
                    document.documentElement.classList.remove('is-admin-role');
                } else {
                    document.documentElement.classList.add('is-admin-role');
                    document.documentElement.classList.remove('is-client-role');
                }
            } catch (e) {
                document.documentElement.classList.add('role-pending');
            }
        })();
    </script>
    <style>
        html.is-client-role .menu-admin-only,
        html.is-client-role .menu-super-admin-only { display: none !important; }
        html.role-pending .layout-principal { visibility: hidden; }
        .bottom-nav { display: none !important; }
        .bottom-nav svg {
            width: 24px !important;
            height: 24px !important;
            max-width: 24px !important;
            max-height: 24px !important;
        }
    </style>

    <link rel="stylesheet" href="css/reset.css?v=4">
    <link rel="stylesheet" href="css/variaveis.css?v=5">
    <link rel="stylesheet" href="css/base.css?v=5">
    <link rel="stylesheet" href="css/layout.css?v=5">
    <link rel="stylesheet" href="css/componentes.css?v=4">
    <link rel="stylesheet" href="css/formularios.css?v=4">
    <link rel="stylesheet" href="css/animacoes.css?v=4">
    <link rel="stylesheet" href="css/responsivo.css?v=5">
    <link rel="stylesheet" href="css/calendario.css?v=2">
</head>
<body class="pagina-calendario">
    <div class="layout-principal">
        <aside class="barra-lateral" id="barra-lateral">
            <div class="barra-lateral-logo">
                <img src="img/logo.svg" alt="ARMS" class="logo-svg">
            </div>

            <nav style="display: flex; flex-direction: column; gap: 8px; padding: 0 12px;">
                <a href="dashboard.html" class="menu-item">
                    <span data-i18n="nav.dashboard">Painel de Controlo</span>
                </a>
                <a href="pedidos.html" class="menu-item">
                    <span data-i18n="nav.pedidos">Pedidos</span>
                </a>
                <a href="calendario.html" class="menu-item activo">
                    <span data-i18n="nav.calendario">Calendário</span>
                </a>
                <a href="clientes.html" class="menu-item menu-admin-only">
                    <span data-i18n="nav.clientes">Clientes</span>
                </a>
                <a href="areas.html" class="menu-item menu-admin-only">
                    <span data-i18n="nav.areas">Departamentos</span>
                </a>

                <hr class="menu-admin-only" style="border-color: #333; margin: 16px 0; border-style: solid; border-width: 1px 0 0 0;">

                <a href="admin-utilizadores.html" class="menu-item menu-admin-only">
                    <span data-i18n="nav.admin">Administração</span>
                </a>
                <a href="#" class="menu-item" style="color: #ef4444;" id="btn-sair">
                    <span data-i18n="nav.sair">Terminar Sessão</span>
                </a>
            </nav>
        </aside>

        <main class="area-conteudo" style="min-width: 0; overflow-x: hidden;">
            <header class="cabecalho-principal">
                <div style="display: flex; align-items: center;">
                    <h2 style="font-size: 1.25rem;" data-i18n="nav.calendario">Calendário</h2>
                </div>

                <div class="cabecalho-acoes" style="display: flex; align-items: center; gap: 16px;">
                    <a href="notificacoes.html" style="color: var(--texto-secundario); position: relative; text-decoration: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background-color: #f4f4f5; transition: var(--transicao);" title="Notificações">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </a>

                    <a href="perfil.html" style="text-decoration: none;" title="O Meu Perfil">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background-color: var(--aksanti-gold); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.1rem;" data-arms-avatar aria-label="Utilizador"></div>
                    </a>

                    <div style="width: 1px; height: 24px; background-color: #e4e4e7; margin: 0 8px;"></div>
                    <select id="select-idioma-aksanti" class="input-controlo" style="width: auto; padding: 6px 12px;">
                        <option value="pt">Português</option>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                    </select>
                </div>
            </header>

            <div class="conteudo-pagina">
                <section class="calendario-topo">
                    <div>
                        <h1 data-i18n="nav.calendario">Calendário</h1>
                    </div>
                    <div class="calendario-acoes">
                        <button type="button" class="btn btn-secundario" id="btn-baixar-pdf-calendario">Baixar PDF</button>
                        <button type="button" class="btn btn-secundario" id="btn-vincular-calendario">Vincular Calendário</button>
                    </div>
                </section>

                <section class="calendario-toolbar" aria-label="Controlo do calendário">
                    <div class="calendario-navegacao">
                        <h2 class="calendario-periodo" id="calendario-periodo">...</h2>
                        <button type="button" class="calendario-icone-btn" id="btn-calendario-anterior" aria-label="Período anterior">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg>
                        </button>
                        <button type="button" class="calendario-icone-btn" id="btn-calendario-proximo" aria-label="Próximo período">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"></path></svg>
                        </button>
                        <button type="button" class="btn btn-secundario" id="btn-calendario-hoje">Hoje</button>
                    </div>

                    <div class="calendario-modos">
                        <button type="button" class="calendario-modo ativo" id="btn-modo-mensal">Mensal</button>
                        <button type="button" class="calendario-modo" id="btn-modo-semanal">Semanal</button>
                        <select id="filtro-calendario" class="input-controlo" style="width: 210px;">
                            <option value="">Todos os eventos</option>
                            <option value="prazos">Prazos</option>
                            <option value="urgente">Urgentes</option>
                            <option value="pedido">Pedidos criados</option>
                            <option value="movimentos">Movimentos</option>
                            <option value="decisoes">Decisões</option>
                        </select>
                    </div>
                </section>

                <section class="calendario-kpis" aria-label="Resumo do calendário">
                    <div class="calendario-kpi">
                        <span>Total</span>
                        <strong id="calendario-kpi-total">0</strong>
                    </div>
                    <div class="calendario-kpi">
                        <span>Prazos</span>
                        <strong id="calendario-kpi-prazos">0</strong>
                    </div>
                    <div class="calendario-kpi">
                        <span>Urgentes</span>
                        <strong id="calendario-kpi-urgentes">0</strong>
                    </div>
                    <div class="calendario-kpi">
                        <span>Decisões</span>
                        <strong id="calendario-kpi-decisoes">0</strong>
                    </div>
                </section>

                <section class="calendario-layout">
                    <div class="calendario-card" id="calendario-corpo">
                        <div class="calendario-carregando">A carregar calendário...</div>
                    </div>

                    <aside class="calendario-dia-painel" aria-label="Eventos do dia selecionado">
                        <h2 id="calendario-dia-titulo">Hoje</h2>
                        <p id="calendario-dia-resumo">A carregar eventos...</p>
                        <div class="calendario-lista-dia" id="calendario-lista-dia"></div>
                    </aside>
                </section>
            </div>
        </main>
    </div>

    <script type="application/json" id="lang-pt">
    {
        "nav": {"dashboard": "Painel de Controlo", "pedidos": "Pedidos", "calendario": "Calendário", "clientes": "Clientes", "areas": "Departamentos", "notificacoes": "Notificações", "perfil": "O Meu Perfil", "admin": "Administração", "sair": "Terminar Sessão"},
        "moeda": {"AOA": "Kwanza", "USD": "Dólar", "EUR": "Euro"}
    }
    </script>
    <script type="application/json" id="lang-en">
    {
        "nav": {"dashboard": "Dashboard", "pedidos": "Requests", "calendario": "Calendar", "clientes": "Clients", "areas": "Departments", "notificacoes": "Notifications", "perfil": "My Profile", "admin": "Administration", "sair": "Sign Out"},
        "moeda": {"AOA": "Kwanza", "USD": "Dollar", "EUR": "Euro"}
    }
    </script>
    <script type="application/json" id="lang-fr">
    {
        "nav": {"dashboard": "Tableau de Bord", "pedidos": "Demandes", "calendario": "Calendrier", "clientes": "Clients", "areas": "Départements", "notificacoes": "Notifications", "perfil": "Mon Profil", "admin": "Administration", "sair": "Se Déconnecter"},
        "moeda": {"AOA": "Kwanza", "USD": "Dollar", "EUR": "Euro"}
    }
    </script>

    <script src="js/i18n.js?v=5"></script>
    <script src="js/sidebar.js?v=5"></script>
    <script src="js/modal.js"></script>
    <script src="js/exportacoes.js"></script>
    <script src="js/notificacoes.js?v=5"></script>
    <script src="js/tempo-real.js?v=5"></script>
    <script src="js/calendario.js?v=2"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('btn-sair').addEventListener('click', (evento) => {
            evento.preventDefault();
            if (typeof ArmsSessao !== 'undefined') {
                ArmsSessao.terminar();
            } else {
                localStorage.removeItem('arms_utilizador_logado');
                window.location.href = 'index.html';
            }
        });
    </script>
        <!-- Bottom Navigation Bar (Apenas Mobile) -->
    <nav class="bottom-nav">
        <div class="bottom-nav-container">
            <a href="dashboard.html" class="bottom-nav-item">

                <span>Painel</span>
            </a>
            <a href="pedidos.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <span>Pedidos</span>
            </a>
            <a href="calendario.html" class="bottom-nav-item activo">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span>Calendário</span>
            </a>
            <a href="perfil.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Perfil</span>
            </a>
        </div>
    </nav>
</body>
</html>
