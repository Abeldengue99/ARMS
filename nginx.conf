server {
    listen 80;
    server_name _;
    root /app;

    # Desativar index automático na raiz
    index off;

    # 1. API - Reencaminha /api/... para /Backend/api/...
    location /api/ {
        alias /app/Backend/api/;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # 2. Raiz exacta - Redireciona para o index.html do Frontend
    location = / {
        rewrite ^ /Frontend/index.html last;
    }

    # 3. Assets (CSS, JS, Imagens, Linguagem) - Reencaminha para /Frontend/...
    location ~ ^/(css|js|img|lang)/ {
        rewrite ^/(.*)$ /Frontend/$1 last;
    }

    # 4. Ficheiros HTML - Procura no Frontend
    location ~ \.html$ {
        try_files /Frontend$uri =404;
    }

    # 5. Tudo o resto - Tenta no Frontend
    location / {
        try_files $uri /Frontend$uri /Frontend/index.html;
    }

    # 6. Execução PHP para ficheiros dentro do Backend
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
