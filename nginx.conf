server {
    listen 80;
    server_name _;
    
    # Definir a raiz principal para o Frontend
    root /app/Frontend;
    index index.html;

    # Proteger ficheiros ocultos (.env, .git, etc)
    location ~ /\. {
        deny all;
    }

    # 1. Backend API (redireciona /api/ para a pasta interna)
    location /api/ {
        alias /app/Backend/api/;

        # Executar scripts PHP da pasta API
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # 2. Aplicação Frontend Estática
    # Service Worker must be revalidated after deploys, otherwise old assets can stay active.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /sw.js =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /version.json =404;
    }

    # HTML pages must not stay stale after a production deploy.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location / {
        # Tenta servir o ficheiro exato, se não existir envia o index.html (SPA routing)
        try_files $uri $uri/ /index.html;
    }
}
