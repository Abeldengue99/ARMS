<!DOCTYPE html>
<!-- Estou a abrir o ficheiro que alberga toda a base de dados dos clientes da Aksanti no ecrã (O Listar Clientes) -->
<html lang="pt">

<head>
    <!-- Estou a prevenir que os caracteres fiquem partidos nas janelas com acentuação de pt-pt -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Estou a espetar na aba superior do browser o letreiro para saberes que tàs nos teus Clientes -->
    <title>Clientes - ARMS</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="shortcut icon" type="image/png" href="img/favicon.png">
    <meta name="theme-color" content="#111111">
    <!-- Script Anti-Flicker: Ocultar imediatamente links admin para clientes usando localStorage antes de renderizar a página -->
    <script src="js/anti-flicker.js?v=15"></script>

    <!-- Estou a puxar e a vestir todo o corpo disto com as nossas roupas pesadas da base do CSS -->
    <link rel="stylesheet" href="css/reset.css?v=10">
    <link rel="stylesheet" href="css/variaveis.css?v=10">
    <link rel="stylesheet" href="css/base.css?v=10">
    <link rel="stylesheet" href="css/layout.css?v=15">
    <link rel="stylesheet" href="css/componentes.css?v=10">
    <link rel="stylesheet" href="css/formularios.css?v=10">
    <link rel="stylesheet" href="css/tabelas.css?v=10">
    <link rel="stylesheet" href="css/animacoes.css?v=10">
    <link rel="stylesheet" href="css/responsivo.css?v=10">
    <link rel="manifest" href="js/manifest.json">
    <meta name="theme-color" content="#1a1a2e">
</head>

<body>

    <!-- Estou a criar e amontoar no mesmo sítio as barras negras laterais (Menu do painel) -->
    <div class="layout-principal">

        <aside class="barra-lateral" id="barra-lateral">
            <!-- Botão de Expandir/Recolher Barra Lateral -->
            <button id="btn-toggle-sidebar" class="btn-toggle-sidebar" aria-label="Minimizar Menu"
                style="position: absolute; right: 12px; top: 40px; width: 32px; height: 32px; border-radius: 50%; background: var(--aksanti-dark); border: 2px solid var(--bg-card); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 50; transition: transform 0.3s ease;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" style="width: 18px; height: 18px;">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="barra-lateral-logo">
                <img src="img/logo.svg" alt="ARMS" class="logo-svg">
            </div>

            <nav style="display: flex; flex-direction: column; gap: 8px; padding: 0 12px;">
                <!-- Estou a matar o brilho ativo do botão "Dashboard" ou "Pedidos", porque já não pertences lá e sim cá! -->
                <a href="dashboard.html" class="menu-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="feather feather-home">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg><span data-i18n="nav.dashboard">Painel de Controlo</span>
                </a>
                <a href="pedidos.html" class="menu-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="feather feather-file-text">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg><span data-i18n="nav.pedidos">Pedidos</span>
                </a>
                <a href="calendario.html" class="menu-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="feather feather-calendar">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg><span data-i18n="nav.calendario">Calendário</span>
                </a>
                <!-- Estou a acender é força bruta as tochas Douradas neste menu. "Tu estás nos teus Clientes! O ativo mora aqui!" -->
                <a href="clientes.html" class="menu-item menu-admin-only activo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="feather feather-users">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg><span data-i18n="nav.clientes">Clientes</span>
                </a>
                <a href="areas.html" class="menu-item menu-admin-only">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="feather feather-layers">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg><span data-i18n="nav.areas">Departamentos</span>
                </a>

                <hr class="menu-admin-only"
                    style="border-color: #333; margin: 16px 0; border-style: solid; border-width: 1px 0 0 0;">
                <a href="admin-utilizadores.html" class="menu-item menu-admin-only">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="feather feather-settings">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg><span data-i18n="nav.admin">Administração</span>
                </a>
                <a href="#" class="menu-item" style="color: #ef4444;" id="btn-sair">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="feather feather-log-out">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg><span data-i18n="nav.sair">Terminar Sessão</span>
                </a>
            </nav>
        </aside>

        <!-- Estou a deitar a placa branca do ecrã principal a dominar a vista direita -->
        <main class="area-conteudo" style="min-width: 0; overflow-x: hidden;">

            <!-- Estou a fechar a tampa no telhado para colocar ali quem às, que línguas escolhes e as moedas -->
            <header class="cabecalho-principal">
                <div style="display: flex; align-items: center;">
                    <!-- Estou a avisar no teto ao tradutor i18n que isto se traduz a ler por "Clientes" -->
                    <h2 style="font-size: 1.25rem;" data-i18n="nav.clientes">Clientes</h2>
                </div>

                <div class="cabecalho-acoes">
                    <a href="notificacoes.html" class="botao-notificacao" title="Notificações">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg><span class="notificacao-ponto"></span>
                    </a>

                    <a href="perfil.html" class="avatar-link" title="O Meu Perfil">
                        <div class="avatar-utilizador" data-arms-avatar aria-label="Utilizador"></div>
                    </a>

                    <div class="divisor-cabecalho"></div>
                    <select id="select-idioma-aksanti" class="input-controlo select-idioma-admin">
                        <option value="pt">Português</option>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                    </select>
                </div>
            </header>

            <div class="conteudo-pagina">

                <!-- Estou a arrumar um flex no meio para teres ali espaço entre o título Clientes e o Botão d'Ouro "Adicionar" -->
                <div
                    style="display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px;">
                    <h2 style="font-size: 1.5rem; color: var(--texto-principal);" data-i18n="clientes.titulo">Gestão de
                        Clientes</h2>
                    <div
                        style="display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px;">
                        <button id="btn-exportar-pdf-clientes" class="btn btn-secundario"
                            style="min-height: 42px; padding: 8px 18px; font-weight: 800;">Baixar PDF</button>
                        <button id="btn-exportar-excel-clientes" class="btn btn-secundario"
                            style="min-height: 42px; padding: 8px 18px; font-weight: 800; color: #166534; background: #dcfce7;">Baixar
                            Excel</button>
                        <button id="btn-adicionar-cliente" class="btn btn-primario"
                            data-i18n="clientes.adicionar">Adicionar Cliente</button>
                    </div>
                </div>

                <!-- Estou a convocar aquela animação deslumbrante (Deslize da ISAF) também para estas páginas de grelhas gigantes! -->
                <div class="card deslizar-cima-isaf">

                    <div style="margin-bottom: 20px; display: flex; gap: 16px;">
                        <input type="text" id="filtro-clientes" class="input-controlo"
                            placeholder="Pesquisar Nome ou NIF..." data-i18n-placeholder="clientes.placeholder_pesquisa"
                            style="max-width: 300px;">
                    </div>

                    <div style="overflow-x: auto;">
                        <table class="tabela-responsiva"
                            style="width: 100%; text-align: left; border-collapse: collapse;">
                            <thead>
                                <tr style="border-bottom: 1px solid #e4e4e7;">
                                    <!-- Estou a puxar nomes diretos na tabela para "Empresa, Identidade, Pessoal para chatear (Contato), e a Ação no fim! -->
                                    <th style="padding: 12px 16px; color: var(--texto-secundario); font-weight: 500;"
                                        data-i18n="clientes.nome_empresa">Empresa</th>
                                    <th style="padding: 12px 16px; color: var(--texto-secundario); font-weight: 500;"
                                        data-i18n="clientes.nif">NIF</th>
                                    <th style="padding: 12px 16px; color: var(--texto-secundario); font-weight: 500;"
                                        data-i18n="clientes.morada">Localização</th>
                                    <th style="padding: 12px 16px; color: var(--texto-secundario); font-weight: 500;"
                                        data-i18n="clientes.contacto_principal">Pessoa de Contacto</th>
                                    <th style="padding: 12px 16px; color: var(--texto-secundario); font-weight: 500;"
                                        data-i18n="tabela.status">Estado</th>
                                    <th style="padding: 12px 16px; color: var(--texto-secundario); font-weight: 500; text-align: right;"
                                        data-i18n="tabela.acoes">Ações</th>
                                </tr>
                            </thead>
                            <!-- Estou a cimentar o buraco (Tbody vazio) para o teu motor de JavaScript das tabelas espetar a tinta lá! -->
                            <tbody id="tabela-corpo-clientes">
                                <!-- O JavaScript vai encher este espaço com os dados mock dos clientes! -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Estou a colar ao chão as trancas e fundações das línguas, e as ligações e navegação das abas -->
    <script src="js/i18n.js?v=10"></script>
    <!-- moeda.js removed: currency selector removed -->
    <script src="js/sidebar.js?v=15"></script>
    <script src="js/modal.js"></script>
    <script src="js/exportacoes.js"></script>
    <!-- O Cérebro do Real-Time Engine para a página de clientes -->
    <script src="js/tempo-real.js?v=10"></script>

    <!-- Estou a trazer e invocar o script de manipulação da tela, os teus clientes listados em loops For -->
    <script src="js/notificacoes.js?v=10"></script>
    <script src="js/app.js?v=10"></script>
    <script src="js/pages/clientes.js?v=15"></script>


    <!-- Bottom Navigation Bar (Apenas Mobile) -->
    <nav class="bottom-nav">
        <div class="bottom-nav-container">
            <a href="dashboard.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg><span data-i18n="nav.dashboard">Painel</span>
            </a>
            <a href="pedidos.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg><span data-i18n="nav.pedidos">Pedidos</span>
            </a>
            <div class="bottom-nav-fab-container">
                <a href="pedidos.html?action=novo" class="bottom-nav-fab">
                    <svg viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </a>
            </div>
            <a href="calendario.html" class="bottom-nav-item">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg><span data-i18n="nav.calendario">Calendário</span>
            </a>
            <a href="#" class="bottom-nav-item" id="btn-bottom-menu">
                <svg viewBox="0 0 24 24">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg><span>Menu</span>
            </a>
        </div>
    </nav>


    <script src="js/pwa.js"></script>
</body>

</html>
