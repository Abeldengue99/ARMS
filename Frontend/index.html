<!DOCTYPE html>
<!-- Estou a dizer ao navegador web que isto é um documento HTML5 moderno para que as coisas funcionem bem e perfeitamente no site Aksanti -->
<html lang="pt">
<!-- Estou a abrir o cabeçalho invisível (o Head) da nossa página onde carregamos todos os motores do sistema e a estética (Estilos CSS) do documento -->
<head>
    <!-- Estou a mandar o navegador usar as letras perfeitinhas acentuadas de codificação (O standard da Web UTF-8!) para não dar erros com o é e os Tildes -->
    <meta charset="UTF-8">
    <!-- Estou a preparar as janelas para os ecrãs móveis (Viewports dos telemóveis!) dizendo para a largura da página bater na exata chapa com a largura final dos teus telemóveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Estou a pôr o Letreiro do Título no pequeno canto acima do browser, nos separadores lá no PC para identificares muito bem que aba é a da nossa App -->
    <title>Login - ARMS</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="shortcut icon" type="image/png" href="img/favicon.png">
    <meta name="theme-color" content="#111111">

    <!-- Estou a chamar por fios na linha com as partes essenciais: Primeiro carrega a Vassoura a limpar bugs de estilo velhos dos computadores! -->
    <link rel="stylesheet" href="css/reset.css?v=3">
    <!-- Estou a chamar e acender todo o tesouro escondido de Ouro da tua paleta no CSS, as tais variáveis globais! -->
    <link rel="stylesheet" href="css/variaveis.css?v=7">
    <!-- Estou a importar também a formatação de corpo na página base inteirinha das letras com que digitámos para estarem nas caixas do estilo base! -->
    <link rel="stylesheet" href="css/base.css?v=7">

    <link rel="stylesheet" href="css/animacoes.css?v=11">

    <!-- Estou a inserir um remendo caseiro pequenininho apenas do CSS para que a tela do ecrã de logar a janela (Só ela e mais nada!) bata no centro à medida da cruz na moldura inteira do teu PC  -->
    <link rel="stylesheet" href="css/pages/index.css?v=1">
<link rel="manifest" href="js/manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <style>
        #arms-global-transition { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(248, 249, 250, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 9999999; display: flex; justify-content: center; align-items: center; opacity: 1; transition: opacity 0.35s ease; pointer-events: all; }
        body.dark-theme #arms-global-transition { background: rgba(18, 18, 18, 0.6); }
        .arms-spinner-premium { width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(229,138,19,0.15); border-top-color: #E58A13; animation: armsSpinElegante 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite; box-shadow: 0 0 15px rgba(229,138,19,0.2); }
        @keyframes armsSpinElegante { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #arms-global-transition.esconder { opacity: 0; pointer-events: none; }
    </style>
    <script>
        document.write('<div id="arms-global-transition"><div class="arms-spinner-premium"></div></div>');
        window.addEventListener('load', function() { setTimeout(function() { var el = document.getElementById('arms-global-transition'); if(el) el.classList.add('esconder'); }, 150); });
        document.addEventListener('click', function(e) { 
            var link = e.target.closest('a'); 
            if(!link || !link.href || link.target === '_blank' || link.href.indexOf('#') !== -1 || link.href.startsWith('javascript:')) return; 
            if(link.origin === window.location.origin) { 
                e.preventDefault(); 
                var el = document.getElementById('arms-global-transition');
                if(el) el.classList.remove('esconder'); 
                setTimeout(function() { window.location.href = link.href; }, 250); 
            } 
        });
        window.addEventListener('beforeunload', function() { var el = document.getElementById('arms-global-transition'); if(el) el.classList.remove('esconder'); });
    </script>
</head>

    <div class="login-wrapper animacao-entrar">

        <div class="login-right">
            <div class="login-right-content">

                <form id="form-login">
                    <div class="input-grupo">
                        <label for="email"><span data-i18n="login.email">Endereço de E-mail</span> <span style="color: #ef4444;">*</span></label>
                        <div style="position: relative;">

                            <input type="email" id="email" class="input-controlo" style="padding-left: 44px;">
                        </div>
                    </div>

                    <div class="input-grupo">
                        <label for="senha"><span data-i18n="login.senha">Palavra-passe</span> <span style="color: #ef4444;">*</span></label>
                        <div style="position: relative;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--texto-secundario); pointer-events: none;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <input type="password" id="senha" class="input-controlo" style="padding-left: 44px; padding-right: 48px;">
                            <button type="button" id="btn-ver-senha" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--texto-secundario); padding: 4px;" title="Mostrar palavra-passe">
                                <svg id="icone-olho-aberto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                <svg id="icone-olho-fechado" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>

                    <div class="links-container">
                        <a href="#" data-i18n="login.esqueceu_senha">Esqueceu a sua palavra-passe?</a>
                    </div>

                    <button type="submit" class="btn btn-primario" data-i18n="login.entrar">Entrar no Sistema</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de Recuperação de Senha -->
    <div id="modal-recuperar" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
        <div class="card" style="max-width:420px; width:90%; margin:auto; position:relative; top:50%; transform:translateY(-50%);">
            <button id="btn-fechar-recuperar" style="position:absolute; top:16px; right:16px; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--texto-secundario);">&times;</button>
            <div style="text-align:center; margin-bottom:24px;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--aksanti-gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <h3 style="font-size:1.25rem; margin-top:12px;" data-i18n="login.recuperar_titulo">Recuperar Palavra-passe</h3>
                <p style="color:var(--texto-secundario); font-size:0.9rem; margin-top:8px;" data-i18n="login.recuperar_instrucao">Introduza o seu e-mail e enviaremos instruções para redefinir a sua palavra-passe.</p>
            </div>
            <div class="input-grupo">
                <label for="email-recuperar" data-i18n="login.email">Endereço de E-mail</label>
                <input type="email" id="email-recuperar" class="input-controlo" placeholder="exemplo@empresa.ao" data-i18n-placeholder="login.placeholder_email">
            </div>
            <div id="feedback-recuperar" style="display:none; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:0.9rem;"></div>
            <button id="btn-enviar-recuperar" class="btn btn-primario" style="width:100%;" data-i18n="login.recuperar_enviar">Enviar Instruções</button>
        </div>
    </div>
