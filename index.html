<!-- Estou a abrir o cabeçalho invisével (o Head) da nossa página onde carregamos todos os motores do sistema e a estética (Estilos CSS) do documento -->

    <!-- Estou a inserir um remendo caseiro pequenininho apenas do CSS para que a tela do ecrã de logar a janela (Só ela e mais nada!) bata no centro é medida da cruz na moldura inteira do teu PC  -->
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--aksanti-dark, #111111);
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 860px; /* Reduced from 1000px */
            min-height: 480px; /* Reduced from 560px */
            background-color: #ffffff;
            border-radius: 20px; /* Slightly smaller radius */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-left {
            flex: 1;
            background-color: #ffffff;
            padding: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; /* Center horizontally */
            text-align: center; /* Center text */
            position: relative;
            overflow: hidden;
        }

        .login-left::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background-image: url('img/watermark.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }

        .login-logo {
            max-height: 100px;
        }

        .login-left-desc {
            font-size: 1.1rem;
            color: #475569;
            line-height: 1.6;
            max-width: 90%;
            margin: 0;
            font-weight: 500;
        }

        .login-right {
            flex: 1;
            background-color: var(--aksanti-dark, #111111);
            padding: 40px 48px; /* Slightly reduced top/bottom padding */
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        .login-right-content {
            width: 100%;
            max-width: 320px; /* Slightly reduced from 360px */
        }

        .login-right-title {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 24px;
            text-align: left;
        }

        .login-right .input-grupo {
            margin-bottom: 20px;
            text-align: left;
        }

        .login-right label {
            display: block;
            font-weight: 500;
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .login-right .input-controlo {
            width: 100%;
            padding: 12px 18px; /* Slightly smaller padding */
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(255, 255, 255, 0.05);
            font-size: 1rem;
            color: #ffffff;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .login-right .input-controlo:focus {
            border-color: var(--aksanti-gold, #e88b13);
            background-color: rgba(255, 255, 255, 0.1);
            outline: none;
            box-shadow: 0 0 0 3px rgba(232, 139, 19, 0.2);
        }
        
        .login-right .input-controlo::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .login-right #btn-ver-senha {
            color: #94a3b8 !important;
            right: 16px !important;
        }

        .login-right .links-container {
            text-align: right;
            margin-bottom: 24px;
        }

        .login-right a {
            color: var(--aksanti-gold, #e88b13);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .login-right a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .login-right .btn-primario {
            background-color: var(--aksanti-gold, #e88b13);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .login-right .btn-primario:hover {
            background-color: #d97d0c;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(232, 139, 19, 0.3);
        }

        .login-right .btn-primario:active {
            transform: scale(0.98);
        }

        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;

</head>

        <!-- Estou a convocar ao final de todas as caixas visíveis aos olhos do utilizador o ficheiro com o Cérebro I18n JavaScript, e pôr é prova nos nossos textos as tuas palavras de traduções ao carregar disto. -->
    <script src="js/i18n.js?v=5"></script>
        <script src="js/modal.js"></script>
    
    <script>
        // Toggle mostrar/esconder senha
        document.getElementById('btn-ver-senha').addEventListener('click', () => {
            const campoSenha = document.getElementById('senha');
            const olhoAberto = document.getElementById('icone-olho-aberto');
            const olhoFechado = document.getElementById('icone-olho-fechado');
            if (campoSenha.type === 'password') {
                campoSenha.type = 'text';
                olhoAberto.style.display = 'none';
                olhoFechado.style.display = 'block';
            } else {
                campoSenha.type = 'password';
                olhoAberto.style.display = 'block';
                olhoFechado.style.display = 'none';
            }
        });

        // Modal de recuperação de senha
        const modalRecuperar = document.getElementById('modal-recuperar');
        document.querySelector('a[data-i18n="login.esqueceu_senha"]').addEventListener('click', (e) => {
            e.preventDefault();
            modalRecuperar.style.display = 'flex';
        });
        document.getElementById('btn-fechar-recuperar').addEventListener('click', () => {
            modalRecuperar.style.display = 'none';
        });
        modalRecuperar.addEventListener('click', (e) => {
            if (e.target === modalRecuperar) modalRecuperar.style.display = 'none';
        });
        document.getElementById('btn-enviar-recuperar').addEventListener('click', () => {
            const emailRecuperar = document.getElementById('email-recuperar').value.trim();
            const feedback = document.getElementById('feedback-recuperar');
            const btn = document.getElementById('btn-enviar-recuperar');
            if (!emailRecuperar) {
                feedback.style.display = 'block';
                feedback.style.backgroundColor = 'rgba(239,68,68,0.1)';
                feedback.style.color = '#ef4444';
                feedback.textContent = 'Por favor, introduza o seu e-mail.';
                return;
            }
            btn.textContent = 'A enviar...';
            btn.disabled = true;
            fetch('api/recuperar-senha.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailRecuperar })
            })
            .then(r => r.json())
            .then(data => {
                feedback.style.display = 'block';
                if (data.sucesso) {
                    feedback.style.backgroundColor = 'rgba(34,197,94,0.1)';
                    feedback.style.color = '#22c55e';
                    feedback.textContent = data.mensagem;
                    setTimeout(() => { modalRecuperar.style.display = 'none'; }, 3000);
                } else {
                    feedback.style.backgroundColor = 'rgba(239,68,68,0.1)';
                    feedback.style.color = '#ef4444';
                    feedback.textContent = data.erro;
                }
                btn.textContent = 'Enviar Instruções';
                btn.disabled = false;
            })
            .catch(() => {
                feedback.style.display = 'block';
                feedback.style.backgroundColor = 'rgba(239,68,68,0.1)';
                feedback.style.color = '#ef4444';
                feedback.textContent = 'Erro de ligação ao servidor.';
                btn.textContent = 'Enviar Instruções';
                btn.disabled = false;
            });
        });

        // Login - limpar dados antigos e autenticar
        document.getElementById('form-login').addEventListener('submit', (evento) => {
            evento.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const btn = evento.target.querySelector('button[type="submit"]');
            
            if (!email || !senha) {
                mostrarMensagem('Atenção', 'Por favor, preencha o email e a palavra-passe.');
                return;
            }
            
            const textoOriginal = btn.textContent;
            btn.textContent = 'A entrar...';
            btn.disabled = true;
            
            // IMPORTANTE: Limpar dados da sesséo anterior para evitar conflitos entre contas
            localStorage.removeItem('arms_utilizador_logado');
            localStorage.removeItem('arms_utilizador_dados');

            fetch('api/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            })
            .then(res => res.json())
            .then(data => {
                if (data.sucesso) {
                    localStorage.setItem('arms_utilizador_logado', 'true');
                    localStorage.setItem('arms_utilizador_dados', JSON.stringify(data.utilizador));

                    if (data.utilizador?.senha_expirada === true || data.utilizador?.password_expired === true) {
                        window.location.href = 'perfil.html?senha_expirada=1';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    mostrarMensagem('Atenção', data.erro || 'Não foi possível iniciar sesséo.');
                    btn.textContent = textoOriginal;
                    btn.disabled = false;
                }
            })
            .catch(err => {
                mostrarMensagem('Atenção', 'Erro de ligação ao servidor.');
                btn.textContent = textoOriginal;
                btn.disabled = false;
                console.error(err);
            });
        });
